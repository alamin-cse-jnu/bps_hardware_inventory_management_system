# Production overlay — HTTP intranet deployment (no SSL).
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Prerequisites:
#   1. Set DEBUG=False, ALLOWED_HOSTS, and CSRF_TRUSTED_ORIGINS in .env
#   2. Set a strong SECRET_KEY and POSTGRES_PASSWORD in .env

# Cap container stdout logs. The json-file driver defaults to unbounded, so a
# crash-looping worker could fill the disk with a single repeating traceback.
# 10m x 3 files = 30MB ceiling per container. Note these options are applied at
# container CREATION - `restart` will not pick them up, only `up -d` will.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    logging: *default-logging
    ports: []
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    # gthread instead of the default sync worker: 3 sync workers meant only 3
    # requests could ever be in flight, so one slow PDF/Excel export blocked a
    # third of the site. 3 x 4 = 12 concurrent slots, and each thread keeps its
    # own persistent Postgres connection (see CONN_MAX_AGE).
    # NOTE: keep the gunicorn invocation on one line. This is a YAML folded
    # scalar, and lines indented deeper than the first keep their newline —
    # harmless after a trailing `&&`, but a line break mid-command would cut
    # the argument list off silently.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py create_groups &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --worker-class gthread --workers 3 --threads 4 --timeout 120 --max-requests 1000 --max-requests-jitter 100"

  celery:
    logging: *default-logging
    volumes:
      - media_data:/app/media

  celery-beat:
    logging: *default-logging
    volumes:
      - media_data:/app/media

  nginx:
    logging: *default-logging
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web

  # db and redis are defined in docker-compose.yml; these stubs exist only to
  # give them the same log ceiling.
  db:
    logging: *default-logging

  redis:
    logging: *default-logging
